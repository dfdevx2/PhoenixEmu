# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

kotlin.code.style=official

# R (recursos) nao transitivo: builds incrementais bem mais rapidos.
android.nonTransitiveRClass=true

# O KSP registra os diretorios de codigo gerado via kotlin.sourceSets, e o
# Kotlin embutido do AGP 9 proibe esse DSL. Esta flag e a saida documentada
# pelo proprio AGP. Quando um KSP adaptado ao AGP 9 sair, da para remove-la e
# conferir se o build continua passando.
android.disallowKotlinSourceSets=false

# NAO coloque a RAWG_API_KEY aqui: este arquivo vai para o Git.
# Use ~/.gradle/gradle.properties.
